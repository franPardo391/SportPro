  <nav>

    <a href="../index.html"><button class="boton-nav">Inicio</button></a>
    <a href="mis-reservas.html"><button class="boton-nav">Mis Reservas</button></a>

      <a href="reserva.html" class="tarjeta-pista">

      <a href="reserva.html" class="tarjeta-pista">

      <!-- Cambia foto-tenis por la clase que quieras y pon la ruta en el CSS -->
      <a href="reserva.html" class="tarjeta-pista">
