<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportPro – Recuperar contraseña</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/inicio-sesion.css" />
  <link rel="stylesheet" href="../css/recuperar-contrasena.css" />
</head>
<body>

  <div class="contenedor-pagina">

    <div class="tarjeta-auth tarjeta-recuperar">

      <div class="logo">SP</div>

      <div class="cabecera-recuperar">
        <p class="etiqueta-recuperar">AYUDA DE ACCESO</p>
        <h1>¿Has olvidado tu contraseña?</h1>
        <p class="texto-recuperar">Introduce tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
      </div>

      <form class="formulario">
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="ejemplo@correo.com" />
        </div>

        <button type="submit" class="boton-enviar">Enviar enlace</button>
      </form>

      <div class="acciones-recuperar">
        <a href="inicio-sesion.html">Volver a inicio de sesión</a>
        <a href="registro.html">Volver al registro</a>
      </div>

    </div>

    <div class="pie-auth">
      <a href="#">Términos</a>
      <a href="#">Ley de Privacidad</a>
      <a href="#">Asistencia al cliente</a>
      <a href="#">Cookies</a>
    </div>

  </div>

</body>
</html>
