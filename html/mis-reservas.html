<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportNet – Mis Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/fonts.css" />
<link rel="stylesheet" href="../css/mis-reservas.css" />
</head>
<body>

  <nav>
    <a href="../index.html" class="nav-logo" aria-label="Ir al inicio">
      <img src="../img/logo-sp.png" alt="SportPro" />
    </a>
    <a href="../index.html"><button class="boton-nav">Inicio</button></a>
    <button class="boton-nav activo">Mis Reservas</button>
    <div class="separador-nav"></div>
    <div class="acciones-auth-nav">
      <a href="inicio-sesion.html" class="boton-auth boton-auth-login">
        <span class="icono-auth" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M4 21C4.8 17.9 7.7 16 12 16C16.3 16 19.2 17.9 20 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span>Iniciar sesión</span>
      </a>
      <a href="registro.html" class="boton-auth boton-auth-registro">Registro</a>
    </div>
  </nav>

  <main class="contenido">

    <div class="cabecera-seccion">
      <span class="etiqueta-seccion">Tu actividad</span>
      <h1>Mis reservas</h1>
    </div>

    <div class="lista-reservas">

      <div class="tarjeta-reserva">
        <div class="reserva-info">
          <div class="reserva-nombre">
            <strong>Campo Municipal Norte</strong>
            <span class="estado-reserva confirmado">Confirmado</span>
          </div>
          <div class="reserva-detalles">
            <span>📅 22 Feb 2026</span>
            <span>🕐 10:00</span>
            <span>6,50€</span>
          </div>
        </div>
        <button class="boton-cancelar">Cancelar</button>
      </div>

    </div>

  </main>

</body>
</html>
