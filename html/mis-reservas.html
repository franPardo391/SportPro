<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportNet – Mis Reservas</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/mis-reservas.css" />
</head>
<body>

  <nav>
    <a href="../SportPro.html" class="nav-logo" aria-label="Ir al inicio">
      <img src="../img/logo-sp.png" alt="SportPro" />
    </a>
    <a href="../SportPro.html"><button class="boton-nav">Inicio</button></a>
    <button class="boton-nav activo">Mis Reservas</button>
    <div class="separador-nav"></div>
    <div class="usuario-nav">
      <div class="avatar">👤</div>
      <span>nombre usuario</span>
    </div>
  </nav>

  <main class="contenido">

    <div class="cabecera-seccion">
      <span class="etiqueta-seccion">Tu actividad</span>
      <h1>Mis reservas</h1>
    </div>

    <div class="lista-reservas">

      <div class="tarjeta-reserva">
        <div class="reserva-info">
          <div class="reserva-nombre">
            <strong>Campo Municipal Norte</strong>
            <span class="estado-reserva confirmado">Confirmado</span>
          </div>
          <div class="reserva-detalles">
            <span>📅 22 Feb 2026</span>
            <span>🕐 10:00</span>
            <span>6,50€</span>
          </div>
        </div>
        <button class="boton-cancelar">Cancelar</button>
      </div>

    </div>

  </main>

</body>
</html>
