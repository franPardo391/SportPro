<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportPro – Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/fonts.css" />
<link rel="stylesheet" href="../css/inicio-sesion.css" />
  <link rel="stylesheet" href="../css/registro.css" />
</head>
<body>

  <div class="contenedor-pagina">

    <div class="tarjeta-auth">

      <a href="../index.html" class="volver-link">
        <span class="volver-icon">←</span>
        <span>Volver</span>
      </a>

      <div class="logo">SP</div>

      <div class="cabecera-auth">
        <div class="opcion-auth">
          <a href="inicio-sesion.html">
            <span>Inicia sesión</span>
            <small>en SportPro</small>
          </a>
        </div>
        <div class="opcion-auth activa">
          <span>Regístrate</span>
          <small>en SportPro</small>
        </div>
      </div>

      <form class="formulario">
        <div class="campo">
          <label for="dni">Introduce tu DNI / Correo electrónico</label>
          <input type="text" id="dni" placeholder="DNI o correo electrónico" />
        </div>

        <div class="campo">
          <div class="fila-label">
            <label for="contrasena">Introduce una contraseña</label>
            <a href="recuperar-contrasena.html" class="enlace-olvido">¿Has olvidado tu contraseña?</a>
          </div>
          <input type="password" id="contrasena" placeholder="Contraseña" />
        </div>

        <div class="campo">
          <label for="confirmar">Confirma la contraseña</label>
          <input type="password" id="confirmar" placeholder="Confirma la contraseña" />
        </div>

        <a href="../index.html"><button type="submit" class="boton-enviar">Crear cuenta</button></a>
      </form>

      <div class="divisor">o regístrate con</div>
      <div class="botones-sociales">
        <button class="boton-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google" />
        </button>
        <button class="boton-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" />
        </button>
        <button class="boton-social">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" />
        </button>
      </div>


    </div>

    <div class="pie-auth">
      <a href="#">Términos</a>
      <a href="#">Ley de Privacidad</a>
      <a href="#">Asistencia al cliente</a>
      <a href="#">Cookies</a>
    </div>

  </div>

</body>
</html>
